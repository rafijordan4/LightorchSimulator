name: Lightorch Simulator Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Godot CI
        uses: barichello/godot-ci@v4.4.1
        with:
          godot_version: 4.4.1
          export_debug: true

      - name: Upload project source
        uses: actions/upload-artifact@v4
        with:
          name: lightorch-project-source
          path: |
            project.godot
            scenes/
            scripts/
            README.md
